services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zelaai-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      - BACKEND_CORS_ORIGINS=http://localhost:8501,http://127.0.0.1:8501,http://frontend:8501
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zelaai-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - EXTERNAL_API_TIMEOUT_SECONDS=12.0
    depends_on:
      - backend
    restart: unless-stopped
